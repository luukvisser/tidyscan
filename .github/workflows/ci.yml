name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the repository, nothing else; no job asks for more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff, ty)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check
      - run: uv run --locked ty check

  workflows:
    name: Workflows (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: zizmor
        env:
          # read-only token for zizmor's online audits (known-vulnerable and impostor actions)
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 --format=github .

  reuse:
    name: Licensing (REUSE)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint 5.1.1
        run: docker run --rm -v "$PWD:/data:ro" fsfe/reuse:5.1.1@sha256:11eb8a423ea82776bc2890bb255b61736bec277ef6e2141f8c91d6d88864f9da lint

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # as the runner's user: git refuses a repository owned by someone else, and gitleaks then scans nothing
      - run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --config /repo/.gitleaks.toml

  pdf-only:
    # The package without its extras: the PDF writer; everything else is skipped.
    name: Tests, PDF only (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
      # --no-default-groups: the project alone (installed from this checkout), without Pillow or OCRmyPDF
      - env:
          PYTHON: ${{ matrix.python }}
        run: uv run --locked --no-default-groups --python "$PYTHON" python -m unittest -v tests.test_tidyscan

  ocr:
    # Orientation, skew and OCR with Tesseract, on both OCRmyPDF versions the plugin supports.
    name: Tests, OCR (OCRmyPDF ${{ matrix.ocrmypdf }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        ocrmypdf: ["16", "17"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-osd \
            tesseract-ocr-eng tesseract-ocr-nld ghostscript
      - env:
          OCRMYPDF: ${{ matrix.ocrmypdf }}
        run: uv run --locked --with "ocrmypdf==$OCRMYPDF.*" python -m unittest -v tests.test_tidyscan

  build:
    name: Build (wheel and sdist)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"
      - run: uv build
      - name: The wheel installs and imports outside the checkout
        run: |
          wheel=$(ls "$PWD"/dist/*.whl)
          cd "$RUNNER_TEMP" && uv run --isolated --no-project --with "$wheel" python -c "import tidyscan; print(tidyscan.__version__)"
